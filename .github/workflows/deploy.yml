name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # A project site lives at /<repo>/, so assets need that prefix.
          BASE_PATH: /${{ github.event.repository.name }}/
          # Repository *variables*, not secrets — on purpose. Vite inlines these
          # into the published JavaScript, so they are public the moment the
          # site goes live. Storing them as variables keeps that honest and
          # lets you read them back when debugging. Access is controlled by the
          # RLS policies in supabase/migrations/0001_init.sql instead.
          # Set them under: Settings -> Secrets and variables -> Actions -> Variables
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_OWNER_EMAIL: ${{ vars.VITE_OWNER_EMAIL }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY are not set."
            echo "::error::Add them under Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
